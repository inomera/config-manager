plugins {
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = 'com.inomera.telco.commons'

ext {
    versions = [java     : '25',
                mongodb  : '5.13.0',
                cassandra: '4.19.3',
                redisson : '4.8.0',
                h2       : '2.5.252',
                spring   : '4.1.1',
                jackson  : '3.2.3',
                lombok   : '1.18.48',
                junit    : '6.1.3',
                junit_platform: '6.1.3',
                mockito  : '5.24.0',
    ]
}

subprojects {

    group = rootProject.group

    repositories {
        mavenLocal()
        mavenCentral()
    }

    // Java toolchain and compiler options are configured once here instead of
    // being repeated in every module build script.
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(rootProject.versions.java as int)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.compilerArgs << '-parameters'
        }

        // Surface deprecations in our own sources only. Checked-in generated protobuf test
        // fixtures use APIs that protobuf 4.x deprecated and would drown out the signal.
        tasks.named('compileJava') {
            options.compilerArgs << '-Xlint:deprecation'
        }

        tasks.withType(Javadoc).configureEach {
            options.encoding = 'UTF-8'
            // Generated protobuf sources and Lombok output trip the doclint checks.
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
}

// Sonatype Central Portal Nexus Yapılandırması
nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
            snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')

            username = (project.findProperty('mavenUsername') ?: '') as String
            password = (project.findProperty('mavenPassword') ?: '') as String
        }
    }
}